<!doctype html>
<html lang="zh-Hant">
<head>
<title>托福單字卡</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F3" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">


<style>
/* Layout: one-screen app. Cards view = header with three progress rings, card stack, swipe controls, word-family peek; bottom tab bar switches views. Calm surfaces, three progress colors, dictionary-style morpheme split. */
:root{
  --k:#F5F5F3; --s1:#FFFFFF; --s2:#EFEFEC; --s3:#E2E2DF; --t1:#17181B; --t2:#4A4D55; --t3:#6B6F77; --ln:rgba(0,0,0,.08);
  --r1:#E8443A; --r2:#3FA52B; --r3:#1F7FD6; --pre:#B85C00; --root:#2C8A1E; --warn:#9A6200; --no:#D63A2F;
  --btn:#2E8A1F; --btn-fg:#FFFFFF; --no-bg:rgba(232,68,58,.11);
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.08); --sheet-shadow:0 -10px 30px rgba(0,0,0,.12);
  --scrim:rgba(0,0,0,.28); --focus:rgba(31,127,214,.5); --thumb:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --ease-ios:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1); --ease-bounce:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --k:#0F1012; --s1:#18191C; --s2:#222327; --s3:#2E3035; --t1:#F2F3F5; --t2:#B9BCC4; --t3:#8A8E97; --ln:rgba(255,255,255,.08);
  --r1:#FF6B61; --r2:#8EDB6A; --r3:#5DB2F7; --pre:#FFA94D; --root:#8EDB6A; --warn:#FFC940; --no:#FF6B61;
  --btn:#8EDB6A; --btn-fg:#0E2108; --no-bg:rgba(255,107,97,.16);
  --card-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px rgba(0,0,0,.45); --sheet-shadow:0 -10px 30px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --focus:rgba(93,178,247,.6); --thumb:#3A3C42; color-scheme:dark}}
:root[data-theme="dark"]{
  --k:#0F1012; --s1:#18191C; --s2:#222327; --s3:#2E3035; --t1:#F2F3F5; --t2:#B9BCC4; --t3:#8A8E97; --ln:rgba(255,255,255,.08);
  --r1:#FF6B61; --r2:#8EDB6A; --r3:#5DB2F7; --pre:#FFA94D; --root:#8EDB6A; --warn:#FFC940; --no:#FF6B61;
  --btn:#8EDB6A; --btn-fg:#0E2108; --no-bg:rgba(255,107,97,.16);
  --card-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px rgba(0,0,0,.45); --sheet-shadow:0 -10px 30px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --focus:rgba(93,178,247,.6); --thumb:#3A3C42; color-scheme:dark}

html,body{height:100%;margin:0}
body{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{height:var(--vvh,100%)}
body{background:var(--k);color:var(--t1);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .35s}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:minmax(0,1fr) auto}
.view{min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;animation:viewin .35s var(--ease-out) both}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}}
#v-cards{display:grid;grid-template-rows:auto clamp(232px,40dvh,330px) auto minmax(0,1fr);gap:12px}

/* header */
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd small{display:block;color:var(--t3);font-size:12px;font-weight:700;letter-spacing:.8px}
.hd h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.05;font-variant-numeric:tabular-nums}
.hd h1 em{font-style:normal;color:var(--t3);font-weight:600;font-size:22px}
.ring-btn{width:64px;height:64px;border-radius:32px;display:grid;place-items:center;transition:transform .3s var(--ease-bounce)}
.ring-btn:active{transform:scale(.9)}
svg.rings{transform:rotate(-90deg);display:block}
svg.rings circle{fill:none;stroke-linecap:round;stroke-width:7}
svg.rings .tr{stroke-opacity:.2}
svg.rings .fg{transition:stroke-dashoffset .9s var(--ease-ios)}

/* card stack */
.stage{position:relative;min-height:0}
.card{position:absolute;inset:0;perspective:1400px;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.card.next{pointer-events:none}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s var(--ease-bounce)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--s1);border:1px solid var(--ln);
  box-shadow:var(--card-shadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.row1{display:flex;align-items:center;gap:6px;min-height:36px}
.lv{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--s2);color:var(--t2);letter-spacing:.4px}
.weak{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;color:var(--warn);border:1px solid currentColor}
.speak{margin-left:auto;width:44px;height:44px;border-radius:22px;background:var(--s2);display:grid;place-items:center;transition:transform .25s var(--ease-bounce)}
.speak:active{transform:scale(.88)}
.speak svg{width:18px;height:18px;fill:var(--t1)}
.speak.playing{animation:pulse 1s var(--ease-out) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--s2)}}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow-y:auto}
.word{font-size:clamp(26px,8.4vw,34px);font-weight:800;letter-spacing:-.7px;line-height:1.08;overflow-wrap:anywhere}
.morph{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:6px;padding-bottom:2px}
.mp{display:flex;flex-direction:column;align-items:stretch}
.mp b{font-size:clamp(26px,8.4vw,34px);font-weight:800;letter-spacing:-.5px;line-height:1.08;color:var(--t1);padding:0 1px}
.mp small{display:flex;justify-content:center;width:0;min-width:calc(100% - 4px);margin:3px 2px 0;border-top:2.5px solid currentColor;padding-top:3px;
  font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;color:var(--t3);min-height:19px}
.mp.m-x small{border-color:transparent}
.mp.m-p b,.mp.m-p small{color:var(--pre)}
.mp.m-r b,.mp.m-r small{color:var(--root)}
.ipa{color:var(--t3);font-size:14px}
.pos{color:var(--t2);font-size:12px;font-weight:800;letter-spacing:.6px}
.def{font-size:15px;color:var(--t2);line-height:1.45}
.def.big{font-size:clamp(18px,5.2vw,21px);color:var(--t1);font-weight:600;line-height:1.42}
.zh{font-size:clamp(21px,6vw,25px);font-weight:800;line-height:1.35}
.hint{color:var(--t3);font-size:12px;text-align:center;margin-top:4px}
.stamp{position:absolute;top:18px;padding:4px 11px;border-radius:10px;font-weight:800;font-size:17px;letter-spacing:1px;opacity:0;border:2.5px solid currentColor;pointer-events:none;z-index:3}
.stamp.yes{left:18px;color:var(--root);transform:rotate(-10deg)}
.stamp.no{right:18px;color:var(--no);transform:rotate(10deg)}
.done{position:absolute;inset:0;border-radius:26px;background:var(--s1);border:1px solid var(--ln);box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;animation:popin .6s var(--ease-bounce) both}
@keyframes popin{from{opacity:0;transform:scale(.92)}}
.done h2{margin:4px 0 0;font-size:24px;font-weight:800;letter-spacing:-.4px}
.done p{margin:0;color:var(--t2);font-size:14px;max-width:30ch}
.btn{min-height:50px;padding:0 26px;border-radius:16px;background:var(--btn);color:var(--btn-fg);font-weight:800;font-size:16px;transition:transform .25s var(--ease-bounce),opacity .2s}
.btn:active{transform:scale(.96);opacity:.88}
.skeleton{position:absolute;inset:0;border-radius:26px;background:var(--s1);border:1px solid var(--ln);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:22px}
.skeleton i{display:block;height:14px;border-radius:7px;background:var(--s2);animation:shim 1.1s ease-in-out infinite alternate}
@keyframes shim{to{opacity:.4}}

/* controls */
.ctl{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;align-items:center}
.sm{height:48px;border-radius:16px;background:var(--s2);display:grid;place-items:center;transition:transform .3s var(--ease-bounce),opacity .2s}
.sm svg{width:20px;height:20px;stroke:var(--t2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.no,.yes{height:52px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .3s var(--ease-bounce),opacity .2s}
.no{background:var(--no-bg);color:var(--no)}
.yes{background:var(--btn);color:var(--btn-fg)}
.ctl button:active{transform:scale(.93)}
.ctl button:disabled{opacity:.35;cursor:default;transform:none}

/* family peek */
.peek{position:relative;background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:12px 14px 10px;min-height:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%;touch-action:pan-x}
.peek-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.lbl{display:block;color:var(--t3);font-size:11px;font-weight:800;letter-spacing:.9px}
.more{color:var(--r3);font-size:13px;font-weight:700;white-space:nowrap}
.peek-body{min-height:0;overflow:hidden;font-size:14px;color:var(--t2);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln)}
.r:last-child{border:0}
.r i{font-style:normal;color:var(--t1);font-weight:700}
u{text-decoration:none;color:var(--root);font-weight:800}
.veil{filter:blur(7px);opacity:.45}
.veil-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:13px;color:var(--t2)}
.veil-msg b{color:var(--t1);font-size:16px}

/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:8px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));border-top:1px solid var(--ln);background:var(--k)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;font-size:11px;font-weight:700;color:var(--t3);position:relative;transition:color .25s}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease-bounce)}
.tabs button[aria-selected="true"]{color:var(--t1)}
.tabs button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.06)}
.tabs .dot{position:absolute;top:2px;right:calc(50% - 18px);width:8px;height:8px;border-radius:4px;background:var(--r3)}

/* other views */
.page{display:flex;flex-direction:column;gap:14px;overflow-y:auto;height:100%;padding-bottom:20px}
.page h2{margin:6px 0 0;font-size:30px;font-weight:800;letter-spacing:-.7px}
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px}
.panel h3{margin:0 0 6px;font-size:18px;font-weight:800}
.panel p{margin:0 0 8px;color:var(--t2);font-size:15px;max-width:46ch}
.panel p:last-child{margin-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--r3);border:1px solid currentColor;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.meter{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--r1);transform-origin:left;transition:transform .8s var(--ease-ios)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .35s var(--ease-out);z-index:20}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--s1);border-radius:26px 26px 0 0;box-shadow:var(--sheet-shadow);
  transform:translateY(105%);transition:transform .5s var(--ease-ios);height:88%;display:flex;flex-direction:column;
  padding:8px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:2px auto 10px;flex:0 0 auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:0 0 auto}
.sh-h h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px;min-width:0;overflow-wrap:anywhere}
.text-btn{color:var(--r3);font-weight:700;font-size:16px;min-height:44px;padding:0 4px}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px;padding:12px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sec{animation:viewin .4s var(--ease-out) both}
.sec>.lbl{margin-bottom:6px}
.call{border:1.5px solid var(--warn);border-radius:16px;padding:10px 12px}
.call>.lbl{color:var(--warn)}
.mn{background:var(--s2);border-radius:16px;padding:11px 13px;font-size:15px;color:var(--t2);line-height:1.5}
.root{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.root b{font-size:21px;font-weight:800;color:var(--root)}
.root span{font-size:13px;color:var(--t3);min-width:0}
.li{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 0;border-bottom:1px solid var(--ln);text-align:left}
.li:last-child{border:0}
.li i{font-style:normal;font-weight:700;font-size:17px;color:var(--t1);flex:0 0 auto}
.li span{color:var(--t2);font-size:15px;flex:1;min-width:0}
.li span small{display:block;color:var(--t3);font-size:13px}
.li em{width:28px;height:28px;flex:0 0 28px;border-radius:14px;background:var(--s2);display:grid;place-items:center;transition:transform .25s var(--ease-bounce)}
.li em svg{width:13px;height:13px;fill:var(--t2)}
.li:active em{transform:scale(.85)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 13px;border-radius:20px;background:var(--s2);font-size:15px;transition:transform .25s var(--ease-bounce)}
.chip:active{transform:scale(.94)}
.chip small{color:var(--t3);margin-left:5px;font-size:13px}
.ex{font-size:16px;line-height:1.6;color:var(--t1)}
.ex mark{background:none;color:inherit;font-weight:800;text-decoration:underline;text-decoration-color:var(--root);text-decoration-thickness:2px;text-underline-offset:3px}
.ex-zh{color:var(--t2);font-size:15px;margin-top:4px}
.big-rings{display:flex;align-items:center;gap:16px}
.legend{display:grid;gap:6px;font-size:14px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;color:var(--t2)}
.legend i{width:10px;height:10px;border-radius:5px;flex:0 0 10px}
.legend b{margin-left:auto;color:var(--t1);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s2);border-radius:16px;padding:11px 13px}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12px;color:var(--t3)}
.sh-body>*{flex-shrink:0}
.qcard2{position:relative;border-radius:24px;padding:16px 18px 16px;background:linear-gradient(150deg,color-mix(in srgb,var(--r1) 14%,var(--s1)),var(--s1) 70%);border:1px solid var(--ln);overflow:hidden}
.qt{display:block;text-align:left;width:100%;position:relative;margin-top:2px}
.qt-mark{position:absolute;left:-2px;top:-14px;font-family:Georgia,serif;font-size:72px;line-height:1;color:var(--r1);opacity:.35}
.qt-en{display:block;position:relative;padding-top:18px;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:21px;line-height:1.45;font-weight:700;color:var(--t1);overflow-wrap:anywhere}
.qt-zh{margin:10px 0 0;color:var(--t2);font-size:15px;line-height:1.5}
.qt-by{margin-top:10px;font-size:13px;font-weight:800;color:var(--t1);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.qt-by span{font-weight:600;color:var(--t3)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.setting>span{font-weight:700;font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:10px;padding:2px;position:relative}
.seg button{position:relative;z-index:1;min-height:36px;padding:0 12px;font-size:13px;font-weight:700;color:var(--t3);border-radius:8px;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--t1);background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.voice{display:flex;gap:8px}
.voice select{flex:1;min-width:0;min-height:44px;border-radius:12px;border:0;background:var(--s2);padding:0 12px;font-size:15px}
.muted{color:var(--t3);font-size:13px;margin:6px 0 0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;z-index:30;background:var(--t1);color:var(--k);padding:10px 16px;border-radius:14px;font-size:15px;font-weight:600;transition:opacity .25s,transform .45s var(--ease-ios);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* quiz */
.app{grid-template-columns:minmax(0,1fr)}
.page>*,.qcard>*{flex-shrink:0}
.qwrap{display:flex;flex-direction:column;gap:12px;flex:1 0 auto;padding-top:calc(6px + env(safe-area-inset-top,0px) * 0);animation:viewin .35s var(--ease-out) both}
.qtop{display:flex;align-items:center;gap:12px;padding:10px 2px 4px;min-height:48px}
.qtop .tag{margin:0;white-space:nowrap;font-size:13px}
.qprog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.qbar{flex:1;height:12px;border-radius:6px;background:var(--s2);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--r2),var(--r3));transform-origin:left;transition:transform .7s var(--ease-ios)}
.qcount{color:var(--t3);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qcount b{color:var(--t1);font-size:22px;font-weight:800}
.qstreak{font-size:12px;font-weight:800;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:2px 9px;white-space:nowrap;animation:popin .45s var(--ease-bounce) both}
.qcard{position:relative;background:var(--s1);border:1px solid var(--ln);border-radius:26px;box-shadow:var(--card-shadow);padding:22px 20px 22px;flex:1;min-height:calc(100dvh - 190px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;animation:qin .45s var(--ease-ios) both;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--r3)}
.qcard.t-choose::before{background:var(--r3)} .qcard.t-spell::before{background:var(--pre)} .qcard.t-listen::before{background:var(--r1)} .qcard.t-cloze::before{background:var(--r2)}

  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (;;) { const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; if (!set.has(k)) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
const seenRight = () => Object.values(state.stats).filter(s => s.R > 0).length;

/* ---------- speech ---------- */
let voice = null;
function enVoices(){ const vs = window.speechSynthesis?.getVoices?.() || []; const us = vs.filter(v => /^en[-_]US$/i.test(v.lang)); return us.length ? us : vs.filter(v => /^en[-_]/i.test(v.lang)); }
function pickVoice(){ const vs = enVoices(), saved = lget(VOICE_KEY);
  voice = vs.find(v => v.name === saved) || vs.find(v => /Samantha|Ava|Allison|Google US English|Aria|Jenny|Zira/i.test(v.name)) || vs.find(v => v.localService) || vs[0] || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, btn){
  if (!('speechSynthesis' in window)) { toast('這個瀏覽器不支援發音'); return; }
  if (!voice) pickVoice();
  if (!voice) toast('找不到英文語音，請到手機設定下載「英文（美國）」聲音');

  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .9; if (voice) u.voice = voice;

let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
const haptic = () => { try { navigator.vibrate?.(8); } catch {} };

/* ---------- rings ---------- */
const RADII = [27, 18.5, 10], RVARS = ['--r1', '--r2', '--r3'];
function ringsInit(svg){
  svg.setAttribute('viewBox', '0 0 64 64'); svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = RADII.map((r, i) => { const c = (2 * Math.PI * r).toFixed(1);
    return `<circle class="tr" cx="32" cy="32" r="${r}" stroke="var(${RVARS[i]})"/><circle class="fg" cx="32" cy="32" r="${r}" stroke="var(${RVARS[i]})" stroke-dasharray="${c}" stroke-dashoffset="${c}"/>`; }).join('');
}
function ringsSet(svg, fr){ svg.querySelectorAll('.fg').forEach((el, i) => { const c = 2 * Math.PI * RADII[i]; el.style.strokeDashoffset = (c * (1 - Math.max(0, Math.min(1, fr[i])))).toFixed(1); }); }
function ringFractions(){
  const t = state.unitIds.length, k = state.roundDone ? t : state.known.length;
  const [qf, qt] = quizCount();
  return [k / t, qt ? qf / qt : 0, seenRight() / WORDS.length];
}

/* ---------- spring (interruptible) ---------- */
function spring(from, to, { stiffness = 300, damping = 26, v = {} } = {}, onFrame, onDone){
  const cur = { ...from }, vel = {}; Object.keys(to).forEach(k => vel[k] = v[k] || 0);
  let raf, last = performance.now(), stopped = false;
  const step = now => {
    if (stopped) return;
    const dt = Math.min(32, now - last) / 1000; last = now; let moving = false;
    for (const k in to) { const f = -stiffness * (cur[k] - to[k]) - damping * vel[k]; vel[k] += f * dt; cur[k] += vel[k] * dt;
      if (Math.abs(vel[k]) > .02 || Math.abs(cur[k] - to[k]) > .05) moving = true; }
    onFrame(cur); if (stopped) return;
    if (moving) raf = requestAnimationFrame(step); else { onFrame(to); onDone && onDone(); }
  };
  raf = requestAnimationFrame(step);
  return () => { stopped = true; cancelAnimationFrame(raf); };
}

/* ---------- card faces ---------- */
function wordHTML(w){
  if (!w.morph?.length) return `<div class="word" lang="en">${esc(w.w)}</div>`;
  const label = w.morph.map(([s, g]) => g ? `${s} ${g}` : s).join('＋');
  return `<div class="morph" lang="en" role="img" aria-label="${esc(w.w)}：${esc(label)}">${w.morph.map(([s, g, t]) =>
    `<span class="mp m-${t}"><b>${esc(s)}</b><small>${esc(g)}</small></span>`).join('')}</div>`;
}
function faceHTML(w, side){

  const ipa = `<div class="ipa"><span class="pos">${esc(w.pos)}</span>　/${esc(w.ipa)}/</div>`;
  if (state.round === 1) {

    return `<div class="face back"><div class="row1">${chips}</div><div class="body"><div class="pos">${esc(w.pos)}</div><div class="zh">${esc(w.zh)}</div>${w.colloc[0] ? `<div class="def">${esc(w.colloc[0])}</div>` : ''}</div><div class="hint">右滑熟悉　左滑不熟</div></div>`;
  }
  if (side === 'front') return `<div class="face front"><div class="row1">${chips}</div><div class="body" style="justify-content:center"><div class="def big" lang="en">${esc(w.en)}</div></div><div class="hint">想想是哪個字，再點一下翻面</div></div>`;
  return `<div class="face back"><div class="row1">${chips}${spk}</div><div class="body">${wordHTML(w)}${ipa}<div class="zh">${esc(w.zh)}</div></div><div class="hint">右滑熟悉　左滑不熟</div></div>`;

function cardEl(id, isNext){
  const el = document.createElement('div'); el.className = 'card' + (isNext ? ' next' : ''); el.dataset.id = id;
  if (isNext) el.setAttribute('aria-hidden', 'true');
  else { el.tabIndex = 0; el.setAttribute('role', 'group'); el.setAttribute('aria-label', '字卡。空白鍵翻面，右方向鍵熟悉，左方向鍵不熟'); }
  el.innerHTML = `<div class="flip">${faceHTML(BY[id], 'front')}${faceHTML(BY[id], 'back')}</div><div class="stamp yes" aria-hidden="true">熟悉</div><div class="stamp no" aria-hidden="true">不熟</div>`;
  return el;
}
const setT = (el, x, y, r, s = 1) => el.style.transform = `translate3d(${x}px,${y}px,0) rotate(${r}deg) scale(${s})`;
const NEXT = p => ({ s: .94 + .06 * p, y: 14 - 14 * p, o: .55 + .45 * p });

let topEl = null, nextEl = null, cancelAnim = null;
function renderStage(enterFrom){
  const st = $('#stage'); st.innerHTML = ''; topEl = nextEl = null;
  if (state.roundDone) {
    const r1 = state.round === 1;
    st.innerHTML = `<div class="done" role="status"><svg class="rings" id="doneRings" width="120" height="120"></svg>
      <h2>第 ${state.round} 輪完成</h2><p>${state.unitIds.length} 個字都滑到熟悉了。${r1 ? '測驗已經開放，下一輪改成先看英文解釋再想單字。' : '下一輪會再打亂順序。'}</p>
      <button class="btn" id="nextRound">開始第 ${state.round + 1} 輪</button></div>`;
    const svg = $('#doneRings'); ringsInit(svg); requestAnimationFrame(() => requestAnimationFrame(() => ringsSet(svg, ringFractions())));
    $('#nextRound').onclick = nextRound; syncCtl(); return;
  }
  const [a, b] = state.deck;
  if (b) { nextEl = cardEl(b, true); const n = NEXT(0); setT(nextEl, 0, n.y, 0, n.s); nextEl.style.opacity = n.o; st.appendChild(nextEl); }
  if (a) {
    topEl = cardEl(a, false); st.appendChild(topEl); bindCard(topEl);
    if (enterFrom && !reduce) {
      const W = st.clientWidth, x0 = enterFrom * W * 1.15; setT(topEl, x0, -20, enterFrom * 14);
      cancelAnim = spring({ x:x0, y:-20, r:enterFrom * 14 }, { x:0, y:0, r:0 }, { stiffness:260, damping:24 }, c => setT(topEl, c.x, c.y, c.r));
    } else if (enterFrom === 0 && !reduce) {
      setT(topEl, 0, 0, 0, .96); requestAnimationFrame(() => { if (!topEl) return; topEl.style.transition = 'transform .45s var(--ease-bounce)'; setT(topEl, 0, 0, 0, 1);
        const t = topEl; setTimeout(() => t.style.transition = '', 460); });
    }

}
function syncCtl(){ const on = !!topEl && !state.roundDone; $('#noBtn').disabled = $('#yesBtn').disabled = $('#flipBtn').disabled = !on; $('#undoBtn').disabled = !lastSnap; }

/* ---------- gestures ---------- */
function bindCard(el){
  let sx = 0, sy = 0, x = 0, y = 0, dragging = false, down = false, samples = [];
  const W = () => el.parentElement.clientWidth, yes = el.querySelector('.stamp.yes'), no = el.querySelector('.stamp.no');
  const paint = () => { const w = W(); setT(el, x, y, reduce ? 0 : x / w * 14);
    const p = Math.min(1, Math.abs(x) / (w * .35)); yes.style.opacity = x > 0 ? p : 0; no.style.opacity = x < 0 ? p : 0;
    if (nextEl) { const n = NEXT(p); setT(nextEl, 0, n.y, 0, n.s); nextEl.style.opacity = n.o; } };
  el.addEventListener('pointerdown', e => { if (e.target.closest('button') || busy) return; cancelAnim && cancelAnim(); cancelAnim = null;
    down = true; dragging = false; sx = e.clientX - x; sy = e.clientY - y; samples = [{ t:e.timeStamp, x:e.clientX }]; });
  el.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!dragging && Math.hypot(dx - x, dy - y) > 8) { dragging = true; el.setPointerCapture(e.pointerId); }
    if (!dragging) return; x = dx; y = dy * .35; samples.push({ t:e.timeStamp, x:e.clientX }); if (samples.length > 5) samples.shift(); paint(); });
  const up = e => { if (!down) return; down = false;
    if (!dragging) { if (!e.target.closest('button')) toggleFlip(); return; }
    const s0 = samples[0], s1 = samples[samples.length - 1], vx = (s1.x - s0.x) / Math.max(1, s1.t - s0.t), w = W();
    if (Math.abs(x) > w * .3 || Math.abs(vx) > .55) fling(x > 0 || (Math.abs(x) < 4 && vx > 0) ? 1 : -1, vx * 1000, { x, y });
    else cancelAnim = spring({ x, y }, { x:0, y:0 }, { stiffness:380, damping:28, v:{ x:vx * 1000 } }, c => { x = c.x; y = c.y; paint(); }); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); fling(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); fling(-1); } });
  el.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say, b); });
  el._set = (nx, ny) => { x = nx; y = ny; paint(); };
}
function toggleFlip(){ if (!topEl) return; flipped = !flipped; topEl.classList.toggle('flipped', flipped); renderPeek(); }
function fling(dir, vx = 0, from = { x:0, y:0 }){
  if (!topEl || busy) return; busy = true; cancelAnim && cancelAnim();
  const el = topEl, W = el.parentElement.clientWidth; haptic();
  if (reduce) { el.style.transition = 'opacity .15s'; el.style.opacity = 0; setTimeout(() => commit(dir), 160); return; }
  cancelAnim = spring({ x:from.x, y:from.y }, { x:dir * W * 1.6, y:from.y + 30 }, { stiffness:170, damping:20, v:{ x: vx || dir * 900 } },
    c => { el._set(c.x, c.y); if (Math.abs(c.x) > W * 1.25) { cancelAnim(); commit(dir); } });
}

/* ---------- transitions ---------- */
function commit(dir){
  cancelAnim = null; const id = state.deck[0];
  lastSnap = { state: JSON.parse(JSON.stringify(state)), dir };
  const s = state.stats[id] ||= { L:0, R:0 }; state.deck.shift();
  if (dir > 0) { s.R++; state.known.push(id); } else { s.L++; state.deck.splice(Math.min(REINSERT, state.deck.length), 0, id); }
  if (!state.days.includes(today())) state.days.push(today());
  if (!state.deck.length) { state.roundDone = true; if (state.round === 1) state.r1done[state.unit] = true; haptic(); }
  flipped = false; busy = false; save(); renderCards();
  if (dir < 0) toast(`${BY[id].w} 會在幾張後再出現`);
}
function undo(){ if (!lastSnap || busy) return; const { state: prev, dir } = lastSnap; lastSnap = null; state = prev; flipped = false; save(); renderCards(dir); }
function nextRound(){ state.round++; state.deck = shuffle(state.unitIds); state.known = []; state.roundDone = false; lastSnap = null; flipped = false; save(); renderCards(0);
  toast(`第 ${state.round} 輪：先看英文解釋，再想是哪個字`); }

/* ---------- header + peek ---------- */
function renderHeader(){
  const t = state.unitIds.length, k = state.roundDone ? t : state.known.length;
  $('#hdLabel').textContent = `UNIT ${state.unit + 1} · 第 ${state.round} 輪`;
  $('#hdCount').innerHTML = `${k}<em> / ${t}</em>`;
  ringsSet($('#hdRings'), ringFractions());
  $('#quizDot').hidden = !state.r1done[state.unit];
}
function rootVariants(root){ return root.split('/').map(s => s.trim().replace(/[^a-z]/gi, '')).filter(Boolean).sort((a, b) => b.length - a.length); }
function markRoot(word, root){
  for (const v of rootVariants(root)) { const i = word.toLowerCase().indexOf(v.toLowerCase());
    if (i >= 0) return esc(word.slice(0, i)) + '<u>' + esc(word.slice(i, i + v.length)) + '</u>' + esc(word.slice(i + v.length)); }
  return esc(word);
}
function renderPeek(){
  const p = $('#peek'), id = state.roundDone ? null : state.deck[0];
  if (!id) { p.innerHTML = `<div class="peek-head"><span class="lbl">單字家族</span></div><div class="peek-body">開始下一輪後，這裡會跟著目前的字卡顯示它的單字家族。</div>`; p.disabled = true; return; }
  p.disabled = false; const w = BY[id]; let head = '單字家族', body = '';
  if (w.focus?.length) { head = '你在書上畫線的'; body = w.focus.map(f => { const h = w.look.find(l => l[0] === f); return `<div class="r"><i lang="en">${esc(f)}</i>${esc(h ? h[1] : '')}</div>`; }).join(''); }
  else if (w.roots.length) { const [root, , list] = w.roots[0]; head = `字根 ${root.toUpperCase()}`; body = list.slice(0, 4).map(([a, b]) => `<div class="r"><i lang="en">${markRoot(a, root)}</i>${esc(b)}</div>`).join(''); }
  else if (w.look.length) { head = '長得像、容易混淆'; body = w.look.slice(0, 4).map(([a, b]) => `<div class="r"><i lang="en">${esc(a)}</i>${esc(b)}</div>`).join(''); }
  else body = w.syn.map(([a, b]) => `<div class="r"><i lang="en">${esc(a)}</i>${esc(b)}</div>`).join('');
  const hide = state.round > 1 && !flipped;
  p.innerHTML = `<div class="peek-head"><span class="lbl">${esc(head)}</span><span class="more">${hide ? '' : '看全部 ›'}</span></div>
    <div class="peek-body${hide ? ' veil' : ''}" ${hide ? 'aria-hidden="true"' : ''}>${body}</div>${hide ? '<div class="veil-msg"><b>翻面後才顯示</b>家族裡會出現答案</div>' : ''}`;
  p.setAttribute('aria-label', hide ? '單字家族，翻面後才顯示' : '打開完整單字家族');
}
function renderCards(enterFrom){ renderHeader(); renderStage(enterFrom); renderPeek(); }

/* ---------- sheets ---------- */

(() => { const sh = $('#sheet'); let y0 = null, dy = 0;

/* DEV-START 測試用按鈕：正式版把 DEV 改成 false，或刪掉 DEV-START 到 DEV-END 之間 */

const li = (word, zh, note, html) => `<button class="li" data-say="${esc(word)}" aria-label="${esc(word)}，${esc(zh)}，播放發音"><i lang="en">${html || esc(word)}</i><span>${esc(zh)}${note ? `<small>${esc(note)}</small>` : ''}</span><em aria-hidden="true">${SPK}</em></button>`;
function markEx(s, word){ const stem = (word.length > 4 ? word.slice(0, -1) : word).replace(/[^a-z]/gi, ''); return esc(s).replace(new RegExp('\\b(' + stem + '\\w*)', 'i'), '<mark>$1</mark>'); }
function familyHTML(w){
  let i = 0; const d = () => `style="animation-delay:${(i++) * 45}ms"`, out = [];
  if (w.focus?.length) out.push(`<div class="sec call" ${d()}><span class="lbl">你在書上畫線的</span>${w.focus.map(f => { const h = w.look.find(l => l[0] === f); return li(f, h ? h[1] : ''); }).join('')}</div>`);

  w.roots.forEach(([root, mean, list]) => out.push(`<div class="sec" ${d()}><div class="root"><b lang="en">${esc(root)}</b><span>${esc(mean)}</span></div>${list.map(([a, b]) => li(a, b, '', markRoot(a, root))).join('')}</div>`));
  const look = w.look.filter(l => !w.focus?.includes(l[0]));
  if (look.length) out.push(`<div class="sec" ${d()}><span class="lbl">長得像、容易混淆</span>${look.map(([a, b, n]) => li(a, b, n)).join('')}</div>`);
  if (w.syn.length) out.push(`<div class="sec" ${d()}><span class="lbl">意思相近</span><div class="chips">${w.syn.map(([a, b]) => `<button class="chip" data-say="${esc(a)}" aria-label="${esc(a)}，${esc(b)}"><span lang="en">${esc(a)}</span><small>${esc(b)}</small></button>`).join('')}</div></div>`);
  if (!w.roots.length && !look.length && !w.syn.length && w.deriv.length) out.push(`<div class="sec" ${d()}><span class="lbl">詞性變化</span>${w.deriv.map(x => `<div class="li"><span>${esc(x)}</span></div>`).join('')}</div>`);
  if (w.ex?.[0]) out.push(`<div class="sec" ${d()}><span class="lbl">托福真題例句</span><div class="ex" lang="en">${markEx(w.ex[0], w.w)}</div><div class="ex-zh">${esc(w.ex[1])}</div></div>`);
  if (w.colloc.length) out.push(`<div class="sec" ${d()}><span class="lbl">常見搭配</span>${w.colloc.map(c => `<div class="li"><span>${esc(c)}</span></div>`).join('')}</div>`);

function wmap(){ if (WMAP) return WMAP; WMAP = {}; WORDS.forEach(w => { WMAP[w.w.toLowerCase()] = w; }); return WMAP; }
function lookup(raw){
  const m = wmap(), w = raw.toLowerCase().replace(/’/g, "'").replace(/^-+|-+$/g, '');
  if (m[w]) return m[w];
  const c = [];
  if (w.endsWith("'s")) c.push(w.slice(0, -2));

  if (w.endsWith('ied')) c.push(w.slice(0, -3) + 'y');

  if (w.endsWith('ed')) { c.push(w.slice(0, -2), w.slice(0, -1)); if (w.length > 5 && w[w.length - 3] === w[w.length - 4]) c.push(w.slice(0, -3)); }

}
function artParaHTML(text){

  state.unitCount = Math.ceil(WORDS.length / UNIT_SIZE); // the book grows as more pages are added
  renderCards(0); connectDb();
}).catch(() => { $('#stage').innerHTML = '<div class="done"><h2>字庫載入失敗</h2><p>請重新整理頁面再試一次。</p></div>'; });
})();
</script>

</body>
</html>
